# ─────────────────────────────────────────────────────────────
#  .github/workflows/secrets-audit.yml
#  Dumps all repository-accessible secrets (repo + org level)
#  to an ephemeral artifact with format, redact, and filter options.
#
#  DOCUMENTED FUTURE IMPROVEMENTS:
#  1. Support for Environments:
#     To audit secrets associated with a specific environment (e.g. 'production', 'staging'),
#     an `environment` input can be added to `workflow_dispatch` and configured on the `dump` job
#     as `environment: ${{ inputs.environment }}`.
#
#  2. Asymmetric / Symmetric Artifact Encryption (GPG / OpenSSL):
#     To prevent storing plain-text secrets in the downloadable artifact (accessible to repo readers),
#     the file can be encrypted prior to upload using `gpg --symmetric` or a public GPG key:
#     `gpg --batch --yes --passphrase "$PASSPHRASE" -c "$FILE"` and only upload `$FILE.gpg`.
# ─────────────────────────────────────────────────────────────

name: "🔐 Secrets Audit"

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Output format"
        required: true
        default: "json"
        type: choice
        options: [json, yaml, env]
      redact:
        description: "Redact values (show only keys with [REDACTED] value)"
        required: false
        default: false
        type: boolean
      include_github_token:
        description: "Include automatic ephemeral runner token (GITHUB_TOKEN / github_token)"
        required: false
        default: false
        type: boolean

# ── Minimum Required Permissions ───────────────────────────
permissions:
  contents: read          # Read-only; no write or admin permissions required

# ── Prevent Concurrent Runs on Same Ref ─────────────────────
concurrency:
  group: secrets-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Optional: Approval gate or environment-specific secrets
    # environment: production

    env:
      SECRET_LIST: ${{ toJSON(secrets) }}   # Full dump of secrets context

    steps:

      # ── 1 · Build Secrets File ────────────────────────────
      - name: "Build secrets file"
        id: build
        run: |
          set -euo pipefail

          FORMAT="${{ inputs.format }}"
          REDACT="${{ inputs.redact }}"
          INCLUDE_GH_TOKEN="${{ inputs.include_github_token }}"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          RID="${GITHUB_RUN_ID}"

          # Temporary folder outside workspace to prevent accidental commits
          OUT="/tmp/audit-${RID}"
          mkdir -p "$OUT"

          FILE="$OUT/secrets-${TS}-${RID}.${FORMAT}"

          # 1. Filter out GITHUB_TOKEN unless explicitly requested
          if [[ "$INCLUDE_GH_TOKEN" != "true" ]]; then
            PROCESSED_SECRETS=$(printf '%s\n' "$SECRET_LIST" | jq 'del(.github_token, .GITHUB_TOKEN)')
          else
            PROCESSED_SECRETS="$SECRET_LIST"
          fi

          # 2. Process redaction if requested
          if [[ "$REDACT" == "true" ]]; then
            PROCESSED_SECRETS=$(printf '%s\n' "$PROCESSED_SECRETS" | jq 'with_entries(.value = "[REDACTED]")')
          fi

          # 3. Export to requested format
          case "$FORMAT" in
            json)
              printf '%s\n' "$PROCESSED_SECRETS" | jq . > "$FILE"
              ;;
            yaml)
              printf '%s\n' "$PROCESSED_SECRETS" \
                | jq -r 'to_entries[] | "  \(.key): \(.value)"' \
                | sed '1i\secrets:' > "$FILE"
              ;;
            env)
              printf '%s\n' "$PROCESSED_SECRETS" \
                | jq -r 'to_entries[] | "\(.key)=\(.value)"' > "$FILE"
              ;;
          esac

          # ── Count & Validation ────────────────────────────
          COUNT=$(printf '%s\n' "$PROCESSED_SECRETS" | jq 'length')

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::warning::⚠️  No secrets found in this repository (or all were filtered out)."
          fi

          # ── Step Summary (Visible in Run UI) ──────────────
          SUMMARY="${GITHUB_STEP_SUMMARY}"
          {
            echo "## 🔐 Secrets Audit"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Format | \`$FORMAT\` |"
            echo "| Total Secrets | **$COUNT** |"
            echo "| Redaction Enabled | \`$REDACT\` |"
            echo "| Includes GITHUB_TOKEN | \`$INCLUDE_GH_TOKEN\` |"
            echo "| Timestamp (UTC) | $TS |"
            echo ""
            if [[ "$COUNT" -gt 0 ]]; then
              echo "### Found Keys"
              echo '```'
              printf '%s\n' "$PROCESSED_SECRETS" | jq -r 'keys[]'
              echo '```'
            fi
          } >> "$SUMMARY"

          # ── Expose Outputs for Subsequent Steps ───────────
          {
            echo "file_path=$FILE"
            echo "count=$COUNT"
          } >> "${GITHUB_OUTPUT}"

      # ── 2 · Upload Artifact (Only If Secrets Exist) ───────
      - name: "Upload artifact"
        if: fromJSON(steps.build.outputs.count) > 0
        # Pinning to verified full commit SHA (v7.0.1 - Node 24) to prevent supply chain attacks and deprecation warnings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-audit-${{ github.run_id }}
          path: ${{ steps.build.outputs.file_path }}
          retention-days: 1               # Auto-expire after 24 hours
          overwrite: true

      # ── 3 · Secure Cleanup (Defense-in-Depth) ─────────────
      - name: "Shred temp file"
        if: always()
        run: |
          FILE="${{ steps.build.outputs.file_path }}"
          if [[ -n "$FILE" && -f "$FILE" ]]; then
            shred -u "$FILE" 2>/dev/null || rm -f "$FILE"
          fi
          DIR="$(dirname "$FILE" 2>/dev/null || true)"
          [[ -d "$DIR" ]] && rm -rf "$DIR" || true
